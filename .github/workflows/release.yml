on:
  release:
    types: [created]

name: Build

jobs:
  build:
    name: Build
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      
      - run: bash ./make_release.sh
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.event.release.tag_name }} release/IDMask-Edit-*.zip

      - uses: actions/upload-artifact@v7
        with:
          name: release build
          path: release/IDMask-Edit-*.zip
      